name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json `packageManager`
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Packed markup-board ships dist only
        run: node scripts/check-pack.mjs
      - name: Deploy bundle static checks
        run: infra/sketchbook/sketchbook.test.sh

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter sketchbook exec playwright install --with-deps chromium
      - run: pnpm test:browser

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and probe nginx
        run: infra/sketchbook/sketchbook.test.sh --docker

  publish:
    needs: [check, browser, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release tag
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm 11 — trusted publishing needs npm >= 11.5.1.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - name: Publish unpublished markup-board version
        run: pnpm release
