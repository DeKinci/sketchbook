packages:
  - "packages/*"
  - "apps/*"
# Build-script allowlist: a clean pnpm (CI, Docker) errors with ERR_PNPM_IGNORED_BUILDS
# on any dependency install script not decided here.
allowBuilds:
  esbuild: true
# pnpm 11 reads only auth/registry keys from .npmrc, so settings live here.
# Defensive pin: the build/test toolchain lives in devDependencies, so an install must
# never be prod-only, whatever the ambient config says. (`pnpm config get production`
# misreports this key — check by installing, not with config get.)
production: false
# `pnpm --filter <typo>` otherwise exits 0 having run nothing.
failIfNoMatch: true
