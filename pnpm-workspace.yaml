packages:
  - "packages/*"
  - "apps/*"
# Build-script allowlist: a clean pnpm (CI, Docker) errors with ERR_PNPM_IGNORED_BUILDS
# on any dependency install script not decided here.
allowBuilds:
  esbuild: true
# pnpm 11 reads only auth/registry keys from .npmrc, so settings live here.
# An ambient NODE_ENV=production must never turn `pnpm install` into a prod-only
# install — the build/test toolchain lives in devDependencies.
production: false
# `pnpm --filter <typo>` otherwise exits 0 having run nothing.
failIfNoMatch: true
