# Static serving for apps/sketchbook. Replaces nginx's stock default.conf
# (infra/sketchbook/Dockerfile COPYs it to /etc/nginx/conf.d/default.conf).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # NO SPA HISTORY FALLBACK — deliberate, and verified rather than assumed.
    # Sketchbook has no client-side router and never touches the History API: the only
    # URL input is the query string, read ONCE at load by featuresFromUrl()
    # (in apps/sketchbook/src/App.tsx, the single `window.location` reference in the
    # app). Every real URL is `/` plus a query, which `try_files $uri` serves from
    # index.html unchanged — `?palette=N&fills=0` is not a path. Adding
    # `try_files $uri /index.html` would only convert every mistyped path into a 200
    # serving the app, hiding broken asset references. See README § No SPA fallback.
    location / {
        try_files $uri $uri/ =404;
    }

    # Content-hashed by vite (assets/index-<hash>.js), so the filename changes whenever the
    # bytes do — safe to cache forever, and required for the asset-hash staleness check in
    # the README to mean anything.
    # One header, not `expires 1y` PLUS an add_header — that pair emits two
    # Cache-Control lines and leaves which one wins to the client.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The two unhashed files. index.html names the current asset hashes and build-info.json
    # names the commit, so a cached copy of either is exactly the stale artifact the
    # deployment check exists to catch.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /build-info.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
